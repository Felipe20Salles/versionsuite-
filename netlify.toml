[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Só faz deploy automático da branch main
[context.production]
  branch = "main"

# Branches de feature/fix não geram deploy
[context.branch-deploy]
  command = ""

[context.deploy-preview]
  command = ""

# pip.html foi substituído pelo widget inline — redireciona para a home
[[redirects]]
  from = "/pip.html"
  to = "/"
  status = 301
